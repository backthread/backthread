# Release @backthread/ci — on a `ci-v*` tag: typecheck + test → verify the tag matches
# packages/ci/package.json → publish `@backthread/ci` to npm via OIDC TRUSTED PUBLISHING
# → cut a GitHub Release with auto-generated notes.
#
# The third release namespace in this repo, and it needs its own for the same reason the
# extractor got one: this package's version moves on a different clock from the CLI's.
# It is consumed in three places — a customer's CI runner, the hosted ingress, and the
# host application — so a publish here is the FIRST step of a lockstep, not a leaf.
#
# ⚠ THE LOCKSTEP, IN ORDER. This package holds ONE definition of the wire contract and
# its acceptance gate; the runner that produces a payload and the ingress that accepts one
# both import it. So a change to either is: publish here → bump the host application's
# pin → deploy the ingress. Doing it in any other order means the two halves of the
# contract disagree for the length of the window, which is the exact failure a single
# definition exists to prevent.
#
# SETUP (one-time, NO TOKEN): on npmjs.com → the @backthread/ci package (or the backthread
# org) → Settings → Trusted Publisher, add a GitHub Actions publisher:
#   Organization or user: backthread   Repository: backthread
#   Workflow filename:    release-ci.yml   Environment name: release-ci
#   Allowed actions:      Allow npm publish
# Trusted publishing exchanges THIS workflow's short-lived OIDC token for an npm credential
# at publish time — no NPM_TOKEN secret, no 2FA OTP, nothing to rotate.
#
# To cut a release:
#   1. bump packages/ci/package.json version, commit, merge.
#   2. `git tag ci-v<version> && git push origin ci-v<version>` (tag MUST match the version).
name: Release ci

on:
  push:
    tags: ['ci-v*']

# id-token: write → the OIDC token that trusted publishing + provenance need.
# contents: write → create the GitHub Release.
permissions:
  contents: write
  id-token: write

# Serialize releases of this package so two tags pushed close together can't race the npm
# publish. Its own group — it does not contend with the CLI or the extractor.
concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # MUST equal the "Environment name" set on the npm Trusted Publisher.
    environment: release-ci
    steps:
      # SHA-pinned (not floating tags) — see ci.yml + .github/dependabot.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x. Pinned to
      # 11.18.0 (the last 11.x) instead of @latest: npm 12.0.0 regressed
      # `npm publish --provenance` with "Cannot find module 'sigstore'". See release.yml.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11.18.0
      - run: npm ci
      # A hard prerequisite: this package imports the extractor's TYPES, and the
      # extractor's package.json points types/main at dist/. `npm ci` does not build
      # workspaces, so without this the typecheck fails with "cannot find module" and
      # buries whatever the real error would have been.
      - name: Build @backthread/extractor (this package resolves its types from dist/)
        run: npm run build --workspace @backthread/extractor
      - name: Typecheck
        run: npm run typecheck -w @backthread/ci
      - name: Test
        run: npm test -w @backthread/ci
      # Nothing published may carry an internal reference. PR CI checks this too, but it
      # runs there WITHOUT a build — so `dist/` does not exist and the guard falls back to
      # scanning `src/`. Here dist/ has just been built by the test step's `prepack`-shaped
      # build, so this run checks the actual bytes that go in the tarball.
      - name: No internal references in the tarball
        run: node scripts/check-no-internal-refs.mjs
      # Guard: the tag must match packages/ci/package.json — never publish a version that
      # doesn't match the tag.
      - name: Tag matches package version
        run: |
          PKG="ci-v$(node -p "require('./packages/ci/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != packages/ci/package.json ($PKG). Bump packages/ci/package.json to match the tag." >&2
            exit 1
          fi
      # `npm publish` runs this package's `prepack` (build), so the published dist is
      # always freshly compiled. With OIDC trusted publishing npm authenticates via the
      # workflow's id-token (no NODE_AUTH_TOKEN) and auto-attaches build provenance.
      - name: Publish @backthread/ci to npm (OIDC trusted publishing)
        run: npm publish -w @backthread/ci --provenance --access public
      - name: GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
