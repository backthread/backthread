# TEMPORARY probe — removed before this branch merges.
#
# It proves the end-to-end CI-extraction path (OIDC mint -> ingress -> snapshot)
# against the REAL production ingress before `@backthread/ci` is published, so a
# broken contract is found before a version number is spent on it. It runs the client
# FROM SOURCE, which is the one difference from the permanent workflow that replaces
# it: that one runs `npx @backthread/ci`, the line a customer writes.
name: ci-probe (temporary)

on:
  push:
    branches: [ci-package]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the extractor (the client resolves it at runtime)
        run: npm run build --workspace @backthread/extractor
      - name: Extract and post, from source
        run: npx tsx packages/ci/src/action.ts
